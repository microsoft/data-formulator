<!doctype html>
<!-- Sketch: one slice of a Data Formulator session drawn in each candidate sharp direction.
     Same markup in every frame; only the [data-theme] tokens and a few structural rules change,
     so each direction is something the token layer (src/app/theme.ts lineVariables) could express. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DF sharp — design directions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  body { margin: 0; padding: 32px; background: #ececea; font-family: Inter, system-ui, sans-serif; color: #111; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .lede { margin: 0 0 24px; color: #555; font-size: 13px; max-width: 900px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(660px, 1fr)); gap: 28px; }
  figure { margin: 0; }
  figcaption { font-size: 13px; margin: 0 0 8px; color: #333; line-height: 1.45; }
  figcaption b { font-weight: 600; }

  /* ── Tokens per direction ─────────────────────────────────────────────── */
  .app {
    --accent: #0078d4;
    --paper: #fff; --ink: rgba(0,0,0,.9); --ink-2: rgba(0,0,0,.74); --ink-3: rgba(0,0,0,.5);
    --line-anchor: rgba(0,0,0,.85); --line-frame: rgba(0,0,0,.42); --line-inner: rgba(0,0,0,.22);
    --radius: 4px; --rail: rgba(0,0,0,.28);
    --font-ui: Inter, system-ui, sans-serif; --font-meta: var(--font-ui);
    --meta-size: 12px; --meta-case: none; --meta-track: 0; --meta-ink: var(--ink-2);
    --canvas: linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px) 0 0 / 24px 24px,
              linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px) 0 0 / 24px 24px, #fff;
    --user-bg: #fbefe7; --user-line: rgba(200,90,23,.5); --user-rule: 0px;
    --art-bg: #e9f1fb; --art-line: rgba(0,120,212,.6); --art-weight: 500;
    --th-bg: #f7ece4; --th-line: 2px solid #c85a17;
    --pop-shadow: 0 4px 12px rgba(0,0,0,.12);
    --series: #e45756, #4c78a8, #f58518, #72b7b2, #54a24b, #b279a2;
  }
  .app[data-theme="ink"] {
    --line-anchor: #111; --line-frame: rgba(0,0,0,.16); --line-inner: rgba(0,0,0,.09);
    --radius: 2px; --rail: rgba(0,0,0,.14);
    --canvas: #fff;
    --meta-size: 11.5px; --meta-ink: var(--ink-3);
    --user-bg: transparent; --user-line: transparent; --user-rule: 2px;
    --art-bg: transparent; --art-line: rgba(0,0,0,.16); --art-weight: 600;
    --th-bg: transparent; --th-line: 1px solid #111;
    --pop-shadow: none;
  }
  .app[data-theme="instrument"], .app[data-theme="console"] {
    --accent: #0a5cff;
    --line-anchor: #0a0a0a; --line-frame: rgba(0,0,0,.18); --line-inner: rgba(0,0,0,.1);
    --radius: 0px; --rail: rgba(0,0,0,.16);
    --font-meta: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    --meta-size: 10.5px; --meta-case: uppercase; --meta-track: .06em; --meta-ink: var(--ink-3);
    --canvas: radial-gradient(rgba(0,0,0,.16) .8px, transparent 1px) 0 0 / 16px 16px, #fafaf9;
    --user-bg: transparent; --user-line: transparent; --user-rule: 0px;
    --art-bg: #fff; --art-line: rgba(0,0,0,.18); --art-weight: 600;
    --th-bg: transparent; --th-line: 1px solid #0a0a0a;
    --pop-shadow: none;
  }
  .app[data-theme="console"] {
    --accent: #4d94ff;
    --paper: #0d0e10; --ink: rgba(255,255,255,.92); --ink-2: rgba(255,255,255,.7); --ink-3: rgba(255,255,255,.45);
    --line-anchor: rgba(255,255,255,.85); --line-frame: rgba(255,255,255,.16); --line-inner: rgba(255,255,255,.09);
    --rail: rgba(255,255,255,.16);
    --canvas: radial-gradient(rgba(255,255,255,.12) .8px, transparent 1px) 0 0 / 16px 16px, #0b0c0e;
    --art-bg: #121316; --art-line: rgba(255,255,255,.16);
    --th-line: 1px solid rgba(255,255,255,.85);
  }

  /* ── Shared structure ─────────────────────────────────────────────────── */
  .app { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 12.5px;
         height: 520px; display: grid; grid-template-rows: 40px 1fr auto; border: 1px solid rgba(0,0,0,.2); overflow: hidden; }
  .meta { font-family: var(--font-meta); font-size: var(--meta-size); text-transform: var(--meta-case);
          letter-spacing: var(--meta-track); color: var(--meta-ink); font-variant-numeric: tabular-nums; }
  .grow { flex: 1; }
  /* Identifiers (fields, tables, models, sessions) are data: the meta voice never changes their case. */
  .ident { text-transform: none; letter-spacing: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line-frame); }
  .mark { width: 14px; height: 14px; background: var(--ink); border-radius: var(--radius); }
  .brand { font-weight: 600; font-size: 13.5px; }
  .session { margin-left: 16px; color: var(--ink-2); }
  .body { display: grid; grid-template-columns: 270px 1fr; min-height: 0; }

  .thread { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 10px; }
  .thread-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .steps { list-style: none; margin: 0; padding: 0 0 0 18px; position: relative; flex: 1; overflow: hidden; }
  .steps::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 0; width: 1.5px; background: var(--rail); }
  .step { position: relative; margin-bottom: 10px; }
  .mk { position: absolute; left: -18px; top: 4px; width: 13px; display: flex; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); box-shadow: 0 0 0 3px var(--paper); }
  .user .dot { background: #c85a17; }
  .num { display: none; }
  .prompt { padding: 6px 9px; background: var(--user-bg); border: 1px solid var(--user-line); border-radius: var(--radius);
            border-left: var(--user-rule) solid var(--ink); font-weight: 500; line-height: 1.4; }
  .note { color: var(--ink-2); line-height: 1.45; padding: 0 2px; }
  .artifact { padding: 6px 9px; background: var(--art-bg); border: 1px solid var(--art-line); border-radius: var(--radius); }
  .art-title { font-weight: var(--art-weight); }
  .art-meta { display: none; margin-top: 2px; }
  .focused .artifact { box-shadow: 0 0 0 1.5px var(--accent); }
  .thumb { display: block; margin-top: 6px; width: 100%; height: 54px; }

  .composer { margin-top: 8px; border: 1px solid var(--line-anchor); border-radius: var(--radius); padding: 7px 9px; background: var(--paper); }
  .chip { display: inline-block; padding: 1px 7px; border: 1px solid var(--line-inner); border-radius: 10px; color: var(--ink-2); font-size: 11px; }
  .ph { color: var(--ink-3); margin: 6px 0 10px; }
  .cbar { display: flex; align-items: center; gap: 8px; }
  .send { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
  .kbd { display: none; }

  .canvas { background: var(--canvas); padding: 10px 12px 12px 4px; min-height: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 2px; }
  .tab { padding: 5px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0; color: var(--ink-2); font-style: italic; }
  .tab.active { border-color: var(--line-frame); background: var(--paper); color: var(--ink); position: relative; top: 1px; }
  .panel { flex: 1; border: 1px solid var(--line-frame); background: var(--paper); border-radius: 0 var(--radius) var(--radius) var(--radius);
           display: flex; flex-direction: column; min-height: 0; position: relative; }
  .ptool { display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
  .ptool .ref { display: none; }
  .chart { flex: 1; min-height: 0; display: block; width: 100%; }
  .chart text { font-family: var(--font-meta); font-size: 9.5px; fill: var(--ink-3); }
  .chart .axis { stroke: var(--line-inner); }
  table { border-collapse: collapse; width: calc(100% - 20px); margin: 0 10px 10px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; padding: 5px 8px; background: var(--th-bg); border-bottom: var(--th-line); }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line-inner); }
  td.n { text-align: right; }
  .toast { position: absolute; right: 14px; bottom: 54px; padding: 6px 12px; background: var(--paper); border: 1px solid var(--line-inner);
           border-radius: 6px; box-shadow: var(--pop-shadow); }
  .status { display: none; }

  /* ── Instrument / console: the structural additions ───────────────────── */
  [data-theme="instrument"] .tab, [data-theme="console"] .tab { font-style: normal; }
  [data-theme="instrument"] .dot, [data-theme="console"] .dot { display: none; }
  [data-theme="instrument"] .num, [data-theme="console"] .num {
    display: block; font-family: var(--font-meta); font-size: 9.5px; color: var(--ink-3); background: var(--paper); line-height: 1; padding: 1px 0; }
  [data-theme="instrument"] .focused .num, [data-theme="console"] .focused .num { color: var(--accent); }
  [data-theme="instrument"] .prompt, [data-theme="console"] .prompt { padding: 0 2px; }
  [data-theme="instrument"] .prompt::before, [data-theme="console"] .prompt::before { content: "› "; color: var(--accent); font-family: var(--font-meta); }
  [data-theme="instrument"] .art-meta, [data-theme="console"] .art-meta,
  [data-theme="instrument"] .ptool .ref, [data-theme="console"] .ptool .ref,
  [data-theme="instrument"] .kbd, [data-theme="console"] .kbd { display: inline; }
  [data-theme="instrument"] .ptool .label, [data-theme="console"] .ptool .label { display: none; }
  /* A focused artifact is marked by corner ticks rather than a ring. */
  [data-theme="instrument"] .focused .artifact, [data-theme="console"] .focused .artifact {
    box-shadow: none; --t: var(--accent);
    background:
      linear-gradient(var(--t),var(--t)) top left / 8px 1.5px no-repeat, linear-gradient(var(--t),var(--t)) top left / 1.5px 8px no-repeat,
      linear-gradient(var(--t),var(--t)) top right / 8px 1.5px no-repeat, linear-gradient(var(--t),var(--t)) top right / 1.5px 8px no-repeat,
      linear-gradient(var(--t),var(--t)) bottom left / 8px 1.5px no-repeat, linear-gradient(var(--t),var(--t)) bottom left / 1.5px 8px no-repeat,
      linear-gradient(var(--t),var(--t)) bottom right / 8px 1.5px no-repeat, linear-gradient(var(--t),var(--t)) bottom right / 1.5px 8px no-repeat,
      var(--art-bg);
  }
  [data-theme="instrument"] .send, [data-theme="console"] .send { border-radius: 0; background: var(--ink); color: var(--paper); width: auto; padding: 0 7px; height: 20px;
    font-family: var(--font-meta); font-size: 10px; letter-spacing: .06em; }
  [data-theme="instrument"] .chip, [data-theme="console"] .chip { border-radius: 0; font-family: var(--font-meta); font-size: 10px; }
  [data-theme="instrument"] th, [data-theme="console"] th { font-family: var(--font-meta); font-size: 10.5px; color: var(--ink-2); }
  [data-theme="instrument"] td.n, [data-theme="console"] td.n { font-family: var(--font-meta); font-size: 11px; }
  [data-theme="instrument"] .toast, [data-theme="console"] .toast { display: none; }
  [data-theme="instrument"] .status, [data-theme="console"] .status {
    display: flex; gap: 16px; align-items: center; padding: 0 14px; height: 22px; border-top: 1px solid var(--line-frame); }
  .status .live { color: var(--accent); }
  [data-theme="ink"] .toast { border-color: var(--line-frame); border-radius: 2px; }
</style>
</head>
<body>
<h1>Data Formulator · sharp — design directions</h1>
<p class="lede">One slice of the Stock Prices session (thread, composer, chart panel, table) drawn four ways. The markup is identical;
  each frame differs only in tokens and a few structural rules. Read alongside <code>README.md</code>.</p>
<div class="grid" id="grid"></div>

<template id="slice">
  <div class="app">
    <header class="top">
      <span class="mark"></span><span class="brand">Data Formulator</span><span class="session">Stock Prices</span>
      <span class="grow"></span><span class="meta ident">gpt-6.1-sol</span>
    </header>
    <div class="body">
      <aside class="thread">
        <div class="thread-head"><span class="meta"><b style="color:var(--accent);font-weight:500">Thread 1</b></span><span class="grow"></span><span class="meta">5 steps</span></div>
        <ol class="steps">
          <li class="step user"><span class="mk"><i class="dot"></i><i class="num">01</i></span><div class="prompt">How have these stocks performed?</div></li>
          <li class="step"><span class="mk"><i class="dot"></i><i class="num">02</i></span><div class="note">Which stocks gained or lost most from the shared start?</div></li>
          <li class="step focused"><span class="mk"><i class="dot"></i><i class="num">03</i></span>
            <div class="artifact"><div class="art-title">Indexed Stock Performance</div><div class="art-meta meta">Line · 1,247 rows · 6 series</div><svg class="thumb" data-chart="thumb"></svg></div></li>
          <li class="step user"><span class="mk"><i class="dot"></i><i class="num">04</i></span><div class="prompt">Which stocks had the best returns for their risk?</div></li>
          <li class="step"><span class="mk"><i class="dot"></i><i class="num">05</i></span><div class="artifact"><div class="art-title">Stock Return and Volatility</div><div class="art-meta meta">Scatter · 6 rows</div></div></li>
        </ol>
        <div class="composer">
          <span class="chip">Stock performance indexed…</span>
          <div class="ph">Ask questions or describe what to explore</div>
          <div class="cbar"><span class="meta">2 tools</span><span class="grow"></span><span class="meta kbd">⌘↵</span><span class="send">↑</span></div>
        </div>
      </aside>
      <section class="canvas">
        <div class="tabs"><span class="tab active">Stock performance indexed</span><span class="tab">META setback</span></div>
        <div class="panel">
          <div class="ptool"><span class="meta label">Zoom · Line chart</span><span class="meta ref">T1·03 &nbsp;Line &nbsp;<span class="ident">date × indexed_value × symbol</span></span><span class="grow"></span><span class="meta">Share</span><span class="meta">Code</span></div>
          <svg class="chart" data-chart="main"></svg>
          <table>
            <thead><tr><th>date</th><th>symbol</th><th>close</th><th>indexed_value</th></tr></thead>
            <tbody>
              <tr><td>2025-07-31</td><td>AAPL</td><td class="n">207.13</td><td class="n">100.00</td></tr>
              <tr><td>2025-08-01</td><td>AAPL</td><td class="n">201.95</td><td class="n">97.50</td></tr>
            </tbody>
          </table>
          <div class="toast">Successfully loaded Stock Prices</div>
        </div>
      </section>
    </div>
    <footer class="status meta"><span class="live">● Ready</span><span class="ident">Stock Prices</span><span>1 table · 1,247 rows</span><span class="grow"></span><span class="ident">gpt-6.1-sol</span><span>2 tools</span></footer>
  </div>
</template>

<script>
  const frames = [
    ['current', '<b>0 · Current sharp.</b> Lines are near-black, but surfaces still carry tinted fills (peach prompts, blue labels, beige header), a graph-paper canvas, italic tabs and a floating toast with shadow. Several visual systems are mixed in one view.'],
    ['ink', '<b>A · Ink.</b> Subtract: no tinted fills, hairlines one step lighter, colour only for selection and data. Prompts become a 2px rule; artifact titles carry hierarchy by weight. Calm, editorial, still "sharp".'],
    ['instrument', '<b>B · Instrument (recommended).</b> Ink plus a precision layer: a mono, uppercase meta voice for counts and ids, numbered steps, square corners, corner-tick focus, a dot-grid canvas, and a status line that replaces toasts. Reads as a tool.'],
    ['console', '<b>C · Console.</b> Instrument inverted. Not a separate direction to build now, but a test: if B is defined only in tokens, a dark variant comes almost for free.'],
  ];

  // Deterministic stock-like series.
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const drifts = [0.32, 0.12, 0.02, -0.08, 0.0, 0.04];
  const series = drifts.map(d => { let v = 100; return Array.from({ length: 120 }, (_, i) => (v += d + (rnd() - 0.5) * 2.4 - (i > 70 && d < 0 ? 0.25 : 0))); });

  function draw(svg, theme, kind) {
    // Drawn at the element's own size so axis text is never stretched.
    const w = svg.clientWidth || 230, h = svg.clientHeight || 54, m = kind === 'thumb' ? 2 : 26;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const lo = 70, hi = 150, x = i => m + (i / 119) * (w - m - 8), y = v => h - m + 6 - ((v - lo) / (hi - lo)) * (h - m - 4);
    const colours = getComputedStyle(svg).getPropertyValue('--series').split(',').map(s => s.trim());
    const mono = theme === 'instrument' || theme === 'console';
    let out = '';
    if (kind === 'main') {
      [80, 100, 120, 140].forEach(t => out += `<line class="axis" x1="${m}" x2="${w - 8}" y1="${y(t)}" y2="${y(t)}" ${t === 100 ? '' : 'stroke-dasharray="2 3"'}/><text x="2" y="${y(t) + 3}">${t}</text>`);
      ['AUG', 'OCT', 'DEC'].forEach((l, i) => out += `<text x="${x(i * 45 + 5)}" y="${h - 4}">${mono ? l : l[0] + l.slice(1).toLowerCase()}</text>`);
    }
    series.forEach((s, k) => {
      const d = s.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      out += `<path d="${d}" fill="none" stroke="${colours[k]}" stroke-width="${mono ? 1.1 : 1.4}"/>`;
    });
    svg.innerHTML = out;
  }

  const grid = document.getElementById('grid'), tpl = document.getElementById('slice');
  frames.forEach(([theme, caption]) => {
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${caption}</figcaption>`;
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.dataset.theme = theme;
    fig.appendChild(node); grid.appendChild(fig);
  });
  const redraw = () => document.querySelectorAll('.app').forEach(app =>
    app.querySelectorAll('svg[data-chart]').forEach(svg => draw(svg, app.dataset.theme, svg.dataset.chart)));
  redraw(); addEventListener('resize', redraw); document.fonts?.ready.then(redraw);
</script>
</body>
</html>
