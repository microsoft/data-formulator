# The Power Apps demo's profile, served at /demo/powerapps; see ../README.md and README.md.
# Its dataset is live: the sales tables of a Dataverse environment, loaded through the deployment's
# Dataverse connector (id `dataverse`), so its tables refresh from Dataverse. build.py reads them.

name: PowerApps with Data Formulator
# Two lines on the front page: the subject, then where it is explored (the badge follows the second).
headline: "Power Apps data in\nData Formulator"
badge: Preview
tagline: Explore Dataverse sales data with AI agents.
chat_placeholder: Ask about accounts, deals and the sales pipeline…
suggestions:
  - Which accounts have the most open pipeline?
  - How long do our deals take to close?
about:
  - >-
    [Data Formulator](https://github.com/microsoft/data-formulator) is an open-source AI tool from
    Microsoft Research for exploring data with charts, maps, reports and apps.
  - >-
    Here it is connected to a Dataverse environment, the data platform behind Power Apps: accounts
    and their sales opportunities, read live with read-only access. Refresh a table to read it again.
intro: >-
  Ask a question above and the AI analyst loads the Dataverse tables it needs, or open an example
  session to see a question it already answered, as a map or a small app, and keep asking your own.
release: "2026-11"
# Where its data comes from: the deployment's Dataverse connection (DF_SOURCES__dataverse__*). Visitors browse and
# load from it; they cannot add connections of their own.
sources:
  - connector: dataverse
workspace_collapsed: true
# The Power Apps icon (Microsoft's Power Platform icon set, learn.microsoft.com/power-platform/guidance/icons, whose
# terms cover diagrams, training and documentation), beside Data Formulator's logo above the page title.
logo: logo.svg
chart_theme:
  id: powerapps-df
  label: Power Apps
  description: Power Apps purple with clear accents and Segoe UI, for the Power Apps demo.
  extends: datawrapper
  ink:
    text: {primary: "#242424"}
    series:
      single: "#742774"
      categorical: ["#742774", "#0f6cbd", "#e3008c", "#13a10e", "#ca5010", "#4f6bed"]
      categoricalExtended: ["#742774", "#0f6cbd", "#e3008c", "#13a10e", "#ca5010", "#4f6bed", "#8a8886", "#c19c00", "#038387"]
      sequential: {stops: ["#f3e6f2", "#d8b3d6", "#b37ab0", "#8e4a8b", "#5c1f5a"], space: lab}
      diverging: {stops: ["#ca5010", "#f1b48c", "#f2f2f2", "#c79bc5", "#742774"], space: lab}
    accent: "#742774"
  type:
    headline: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif", weight: bold}
    deck: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"}
    axisLabel: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"}
    axisTitle: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"}
    keyLabel: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"}
    valueLabel: {family: "'Segoe UI', 'Helvetica Neue', Arial, sans-serif"}
  # Datawrapper puts long bar names on a line above each bar; Flint 1.0.1 crashes doing so on bars
  # sorted by value, so the names stay beside the bars.
  labels: {rowNames: beside}
# Standing guidance for the analyst on this site: Power Apps makers and sales people trying it out.
analyst_rules: >-
  Visitors are Power Apps makers and sales people trying Data Formulator on their Dataverse data: keep
  answers short (the finding first, then one or two supporting sentences) and pick a sensible reading
  of short questions rather than asking them to choose; say what you chose. Use plain words: never show
  Dataverse logical names (account, cr746_opportunity, cr746_estimatedvalue, …) in answers, charts, maps
  or apps; use labels such as Accounts, Opportunities, Estimated value, Sales stage. Show choice and lookup
  columns by their label columns (the ones ending in "name"). Money is US dollars. Win rate is won deals
  divided by won and lost deals (open deals are not closed yet); say so when you show it. Weighted pipeline
  is estimated value times probability. When a question is about where, show a world map made with the
  map skill (bubbles at the accounts' latitude and longitude); when visitors ask for an app, a tool for
  their team, or a question has a few parts that belong together, build one small app with the html_app
  skill. Cite the source with each result: "Source: Dataverse (Power Apps)".
attribution: >-
  Data: a Dataverse environment's accounts and sales opportunities (Power Apps), read live with read-only
  access. The companies are fictional sample data.
starters:
  - id: sales
    kicker: Dataverse sales
    icon: chart
    title: Sales in Dataverse
    subtitle: Accounts and their opportunities
    source_name: Dataverse (Power Apps)
    start_note: The accounts and opportunities tables from Dataverse
    summary: >-
      60 customer accounts around the world and their 382 sales opportunities, open, won and lost,
      straight from the Power Apps environment.
    description: >-
      Two Dataverse tables loaded through the Dataverse connector: accounts (name, city, country,
      latitude and longitude, sales region, industry, revenue, employees) and opportunities (name,
      account, estimated value, probability, outcome Open/Won/Lost, sales stage, product line, lead
      source, estimated and actual close dates). Join opportunities to accounts on the account id.
    file: sales.zip
    questions:
      - How big is our open pipeline, and which stage is it in?
      - Which product lines win most often?
      - Put our accounts on a map.
    stories:
      - id: pipeline
        label: Where is our pipeline?
        headline: "$12.3M of open pipeline across 83 deals, 44% of it still in Qualify"
        dek: ""
        featured: true
        prompt: "How big is our open pipeline right now?"
        file: stories/pipeline.zip
        image: stories/pipeline.png
        chapters:
        - id: p1
          label: Open pipeline
          kind: chart
          prompt: "How big is our open pipeline right now?"
          headline: "$12.3M of open pipeline across 83 deals, 44% of it still in Qualify"
          stat: "$12.3M"
          message: "open pipeline across 83 deals"
          file: ""
        - id: p2
          label: Regions
          kind: chart
          prompt: "Which sales regions bring in the most?"
          headline: "Europe brings in the most: $5.1M won, at a 51% win rate"
          stat: "$5.1M"
          message: "won in Europe, the top region"
          file: ""
        - id: p3
          label: Accounts on a map
          kind: map
          prompt: "Put our accounts on a map."
          headline: "Accounts in 23 countries; Consolidated Messenger Pte. Ltd. holds the most open pipeline"
          stat: "23"
          message: "countries with our accounts"
          file: "accounts.map.json"
        - id: p4
          label: Deals to chase
          kind: chart
          prompt: "Which open deals should we chase first?"
          headline: "15 deals hold $2.4M of weighted pipeline; the biggest is Best Cloud Platform rollout"
          stat: "$2.4M"
          message: "weighted in the top 15 open deals"
          file: ""
        - id: p5
          label: Pipeline app
          kind: dashboard
          prompt: "Build an app my sales team can use to explore the pipeline."
          headline: "An app to explore $12.3M of open pipeline by region and product line"
          stat: "83"
          message: "open deals to explore in the app"
          file: "pipeline_explorer.app.jsx"
        follow_ups:
          - Which accounts have open deals but nothing won yet?
          - Which industries have the biggest open deals?
          - Add a filter for the sales stage to the app.
      - id: winning
        label: What wins deals?
        headline: "We win 41% of closed deals, up from 29% in 2025 Q2"
        dek: ""
        prompt: "What's our win rate, and is it getting better?"
        file: stories/winning.zip
        image: stories/winning.png
        chapters:
        - id: w1
          label: Win rate
          kind: chart
          prompt: "What's our win rate, and is it getting better?"
          headline: "We win 41% of closed deals, up from 29% in 2025 Q2"
          stat: "41%"
          message: "of closed deals are won"
          file: ""
        - id: w2
          label: Product lines
          kind: chart
          prompt: "Which product lines win most often?"
          headline: "Security wins most often (52%); Cloud Platform wins the biggest deals"
          stat: "52%"
          message: "of Security deals are won"
          file: ""
        - id: w3
          label: Lead sources
          kind: chart
          prompt: "Do some lead sources win more?"
          headline: "Referral deals win 55% of the time; Web leads, our biggest source, 34%"
          stat: "55%"
          message: "of referral deals are won"
          file: ""
        - id: w4
          label: Where we win
          kind: map
          prompt: "Where do we win? Show it on a map."
          headline: "Europe accounts win 50% of their deals; North America West 27%"
          stat: "50%"
          message: "win rate of Europe accounts"
          file: "where_we_win.map.json"
        - id: w5
          label: Forecast app
          kind: dashboard
          prompt: "Make a forecast app for the next two quarters."
          headline: "$3.8M weighted pipeline expected in Q1 2027 and Q2 2027"
          stat: "$3.8M"
          message: "weighted forecast for Q1 2027–Q2 2027"
          file: "sales_forecast.app.jsx"
        follow_ups:
          - How long do won deals take to close, by product line?
          - Which lost deals were the biggest, and at which stage were they lost?
          - Add the forecast by product line to the app.
