# Docker Compose configuration for Data Formulator.
#
# Quick start:
#   1. Copy .env.template to .env and fill in your API keys.
#   2. docker compose up --build
#   3. Open http://localhost:5567 in your browser.

services:
  data-formulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: data-formulator:latest
    ports:
      # Only this machine can connect, which is what makes DF_SINGLE_USER safe below.
      - "127.0.0.1:5567:5567"
    env_file:
      - .env
    environment:
      # The container listens on 0.0.0.0, which alone would select anonymous multi-user
      # mode. Single-user mode (no login, terminal, local folders) is safe here only
      # because the port above is published on localhost.
      DF_SINGLE_USER: "1"
    volumes:
      # Persist workspace data (uploaded files, sessions, etc.) across container restarts.
      - data_formulator_home:/home/appuser/.data_formulator
    restart: unless-stopped

volumes:
  data_formulator_home:
